<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil Placeholder</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="profile-page">
      <header class="top-actions">
        <button class="outline-btn" type="button">VOLTAR</button>
        <button class="outline-btn" type="button">GALERIA</button>
      </header>

      <section class="content-grid">
        <article class="info-card">
          <p><strong>NOME:</strong> <span id="nome">XXXX</span></p>
          <p><strong>IDADE:</strong> <span id="idade">XXXXX</span></p>
          <p><strong>GENERO:</strong> <span id="genero">XXXXX</span></p>
          <p><strong>OCUPAÇÃO:</strong> <span id="ocupacao">XXXXXX</span></p>
          <p><strong>Quantidade de Sexo:</strong> <span id="quantidadeSexo">XXXXX</span></p>

          <p class="bio-title"><strong>BIOGRAFIA:</strong></p>
          <p id="biografia"></p>
        </article>

        <aside class="image-card">
          <img id="imagemPerfil" alt="Imagem do perfil" />
          <p id="placeholderTexto" class="img-placeholder">IMAGEM<br />DO<br />PERFIL</p>
        </aside>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
